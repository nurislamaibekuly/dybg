<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
.stage{width:100%;height:100vh;position:relative;background:#000;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%}
.upload{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:10}
.upload label{cursor:pointer;color:rgba(255,255,255,0.85);font-family:sans-serif;font-size:14px;padding:10px 24px;border:1px solid rgba(255,255,255,0.35);border-radius:20px;background:rgba(0,0,0,0.5)}
#filein{display:none}
</style>

<div class="stage">
  <canvas id="c"></canvas>
  <div class="upload" id="uploader">
    <label>choose a photo<input type="file" id="filein" accept="image/*"></label>
  </div>
</div>

<script type="module">
  import Dybg from './dybg.js';

  const canvas = document.getElementById('c');
  const bg = new Dybg(canvas);
  bg.BLUR_PASSES = 5.3;

  document.getElementById('filein').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    
    const img = new Image();
    img.onload = () => {
      bg.loadImage(img);
      document.getElementById('uploader').style.display = 'none';
    };
    img.src = URL.createObjectURL(file);
  });
</script>
