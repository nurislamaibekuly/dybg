<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ambient cover</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#050506;}
  #app{width:100vw;height:100vh;}
</style>
</head>
<body>
<div id="app"></div>
<button id="playBtn" style="appearance:none;border:none;cursor:pointer;background:rgba(255,255,255,0.08);color:#e9e9ee;font-size:13px;font-weight:500;padding:9px 16px;border-radius:999px;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:10;font-family:-apple-system,'SF Pro Text',Helvetica,Arial,sans-serif;">⏸</button>
<script type="module">
import dybg from './ambient-cover.js';

const bg = new dybg('https://upload.wikimedia.org/wikipedia/en/2/27/NewJeans_-_Supernatural.png');
bg.blur = 110;
bg.layers = 3;
bg.speed = 1;
bg.twist = 0.3;

const btn = document.getElementById('playBtn');
btn.addEventListener('click', () => {
  if(bg.paused){
    bg.play();
    btn.textContent = '⏸';
  } else {
    bg.pause();
    btn.textContent = '▶';
  }
});
</script>
</body>
</html>
